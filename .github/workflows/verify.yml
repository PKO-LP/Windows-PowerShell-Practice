name: Verify published PowerShell practice
on: push
permissions:
  contents: read
jobs:
  readme:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run README commands and check results
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.ToString() -notlike '5.1.*') { throw 'Expected Windows PowerShell 5.1' }
          $md = Get-Content -LiteralPath README.md -Raw -Encoding UTF8
          $lessons = [regex]::Matches($md, '(?ms)^## [^\r\n]+ ([123])\..*?(?=^## |\z)')
          if ($lessons.Count -ne 3) { throw 'Expected three pairs' }
          function Check-Lines($path, $expected) {
            $lines = @(Get-Content -LiteralPath $path -Encoding UTF8)
            if ($lines.Count -ne $expected) { throw "Wrong line count at $path" }
            if ($lines -match [string][char]0xFFFD) { throw "Encoding error at $path" }
          }
          foreach ($lesson in $lessons) {
            $number = $lesson.Groups[1].Value
            $blocks = [regex]::Matches($lesson.Value, '(?ms)^```powershell\r?\n(.*?)^```')
            foreach ($block in $blocks) {
              $code = $block.Groups[1].Value.Trim()
              if ($code.StartsWith('$delivery = Join-Path $docs')) { continue }
              if ($code -match '(?m)^notepad\.exe') {
                if (Get-Command notepad.exe -ErrorAction SilentlyContinue) {
                  Write-Host 'Notepad command found; interactive GUI was not tested.'
                } else { Write-Host 'Notepad absent; README fallback applies.' }
                continue
              }
              if ($code -match '(?m)^Invoke-Item') {
                Get-Command Invoke-Item | Out-Null
                Write-Host 'Explorer command found; interactive GUI was not tested.'
                continue
              }
              Write-Host "PAIR ${number}: $code"
              . ([scriptblock]::Create($code))
            }
            switch ($number) {
              '1' {
                Check-Lines (Join-Path $lab 'original\request.txt') 2
                Check-Lines (Join-Path $lab 'review\request-review.txt') 3
              }
              '2' {
                Check-Lines (Join-Path $lab 'ticket.txt') 2
                Check-Lines (Join-Path $delivery 'ticket-delivery.txt') 2
                Check-Lines (Join-Path $delivery 'handoff.txt') 2
                if (Test-Path -LiteralPath (Join-Path $lab 'ticket-delivery.txt')) { throw 'Move left the source copy in place' }
              }
              '3' {
                Check-Lines (Join-Path $lab 'incoming\instructions.txt') 2
                Check-Lines (Join-Path $lab 'delivery\instructions-ready.txt') 3
                Check-Lines (Join-Path $lab 'delivery\handoff.txt') 3
                if (Test-Path -LiteralPath (Join-Path $lab 'work\instructions-ready.txt')) { throw 'Move left the working copy in place' }
                $names = @(Get-ChildItem -LiteralPath (Join-Path $lab 'delivery') -Name | Sort-Object)
                if (($names -join ',') -cne 'handoff.txt,instructions-ready.txt,request.txt') { throw 'Unexpected delivery files' }
              }
            }
            Write-Host "PAIR $number PASS"
          }
      - name: Check CMD and availability of a legacy PowerShell engine
        shell: cmd
        run: |
          ver
          echo Checking whether CMD accepts a PowerShell cmdlet:
          Set-Content -LiteralPath readme-cmd-probe.txt -Value probe
          if not errorlevel 1 exit /b 1
          if exist readme-cmd-probe.txt exit /b 1
          echo CMD correctly rejected PowerShell syntax.
          set "probe=%TEMP%\cmd-class-probe-%RANDOM%-%RANDOM%"
          mkdir "%probe%" || exit /b 1
          mkdir "%probe%\delivery" || exit /b 1
          echo First line>"%probe%\report.txt"
          echo Second line>>"%probe%\report.txt"
          copy "%probe%\report.txt" "%probe%\copy.txt" || exit /b 1
          move "%probe%\copy.txt" "%probe%\delivery\" || exit /b 1
          if not exist "%probe%\report.txt" exit /b 1
          if exist "%probe%\copy.txt" exit /b 1
          fc /b "%probe%\report.txt" "%probe%\delivery\copy.txt" || exit /b 1
          echo CMD native file operations PASS.
          echo Checking whether Windows PowerShell 2.0 can start:
          powershell.exe -NoProfile -Version 2 -Command "$PSVersionTable.PSVersion.ToString()"
          if errorlevel 1 echo Legacy PowerShell engine could not start on this image.
          exit /b 0
