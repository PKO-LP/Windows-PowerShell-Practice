name: Verify desktop CMD practice
on: push
jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'cmd-desktop'
          New-Item -ItemType Directory -Path "$root\Desktop", "$root\Documents" | Out-Null
          Set-Location "$root\Documents"
          foreach ($n in 1..3) {
            $md = Get-Content "$env:GITHUB_WORKSPACE\cmd-desktop-0$n.md" -Raw -Encoding UTF8
            $matches = [regex]::Matches($md, '(?m)^\x60{3}cmd\r?\n([^\r\n]+)\r?\n\x60{3}')
            if ($matches.Count -lt 15) { throw 'Commands missing' }
            $lines = @('@echo off')
            foreach ($match in $matches) {
              $command = $match.Groups[1].Value
              if ($command -eq 'rmdir Data_Folder /s') { $command = 'echo Y|rmdir Data_Folder /s' }
              $lines += $command
              $lines += 'if errorlevel 1 exit /b 1'
            }
            $lines += 'if exist Data_Folder exit /b 1'
            $batch = Join-Path $env:RUNNER_TEMP 'desktop-practice.cmd'
            Set-Content $batch $lines -Encoding Ascii
            & cmd.exe /d /c $batch
            if ($LASTEXITCODE -ne 0) { throw "Practice $n failed" }
          }
          $expected = @{
            'CMD-Room\equipment.txt' = 'Check projector and cables'
            'CMD-Shift\Handoff\checklist.txt' = 'Check the room before opening'
            'CMD-Shift\Handoff\contacts.txt' = 'Ask the supervisor for the key'
            'CMD-Ticket\Archive\request.txt' = 'Printer does not print'
            'CMD-Ticket\Archive\response.txt' = 'Printer restarted'
          }
          $desktop = "$root\Desktop"
          if (@(Get-ChildItem $desktop -Recurse -File).Count -ne $expected.Count) { throw 'Unexpected file count' }
          foreach ($file in $expected.Keys) {
            if ((Get-Content "$desktop\$file") -cne $expected[$file]) { throw "Wrong content: $file" }
          }
