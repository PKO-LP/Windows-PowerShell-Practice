name: Verify beginner CMD practice
on: push
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        name: Execute the published CMD examples
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, BuildNumber
          function Read-Lines($file) {
            return @(Get-Content -LiteralPath $file)
          }
          function Check-Lines($file, $count) {
            if (@(Read-Lines $file).Count -ne $count) { throw "Wrong line count: $file" }
          }
          foreach ($pair in 1..3) {
            $md = Get-Content -LiteralPath "cmd-0$pair.md" -Raw -Encoding UTF8
            $commands = [regex]::Matches($md, '(?m)^```cmd\r?\n([^\r\n]+)\r?\n```')
            if ($commands.Count -ne 177) { throw 'Wrong command count' }
            $batch = Join-Path $env:RUNNER_TEMP "verify-cmd-$pair.cmd"
            $pathFile = Join-Path $env:RUNNER_TEMP "cmd-lab-path-$pair.txt"
            $lines = @('@echo off', 'setlocal EnableExtensions DisableDelayedExpansion')
            foreach ($match in $commands) {
              $command = $match.Groups[1].Value
              if ($command -match '^(?:where notepad|notepad )') { continue }
              $lines += $command
              $lines += 'if errorlevel 1 exit /b 1'
            }
            $lines += "echo %LAB%>`"$pathFile`""
            $lines += 'exit /b 0'
            Set-Content -LiteralPath $batch -Value $lines -Encoding ASCII
            & cmd.exe /d /v:off /c $batch
            if ($LASTEXITCODE -ne 0) { throw "CMD failed in pair $pair" }
            $root = (Get-Content -LiteralPath $pathFile).Trim()
            if ((Get-Content -LiteralPath (Join-Path $root 'warmup\hello.txt')) -cne 'Hello Windows') { throw 'Warmup content differs' }
            foreach ($n in 2..15) {
              $case = Join-Path $root ('case{0:00}' -f $n)
              $rename = $n -in 5,9,13
              switch ($pair) {
                1 {
                  Check-Lines (Join-Path $case 'note.txt') 2
                  $copy = if ($rename) { 'note-final.txt' } else { 'note-review.txt' }
                  $count = if ($n -eq 2) { 2 } else { 3 }
                  Check-Lines (Join-Path $case $copy) $count
                }
                2 {
                  $copy = if ($rename) { 'ticket-final.txt' } else { 'ticket-copy.txt' }
                  $source = Join-Path $case 'ticket.txt'
                  $dest = Join-Path $case "delivery\$copy"
                  Check-Lines $source 2
                  Check-Lines $dest 2
                  if ((Get-FileHash $source).Hash -ne (Get-FileHash $dest).Hash) { throw 'Copy content differs' }
                  if (Test-Path -LiteralPath (Join-Path $case 'ticket-copy.txt')) { throw 'Moved copy still at source' }
                }
                3 {
                  $guide = if ($rename) { 'guide-ready.txt' } else { 'guide.txt' }
                  Check-Lines (Join-Path $case 'request.txt') 1
                  Check-Lines (Join-Path $case 'delivery\request.txt') 1
                  Check-Lines (Join-Path $case "delivery\$guide") 2
                  Check-Lines (Join-Path $case 'delivery\handoff.txt') 1
                  if (Test-Path -LiteralPath (Join-Path $case 'guide.txt')) { throw 'Moved guide still at source' }
                }
              }
            }
            Write-Host "CMD PAIR $pair PASS"
          }
          & where.exe notepad
          if ($LASTEXITCODE -ne 0) { Write-Host 'Notepad missing; student fallback applies.' }
          exit 0
